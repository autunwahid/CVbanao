<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CV Banao!</title>
<meta name="description" content="Paste a job, pick a country, let AI cook your CV.">
<meta name="theme-color" content="#FFF6E9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23C8F55A' stroke='%23141414' stroke-width='5'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='24' text-anchor='middle' fill='%23141414'%3ECV%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hind+Siliguri:wght@500;700&family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9;--ink:#141414;--card:#fff;--lime:#C8F55A;--pink:#FF5C8A;--violet:#7B61FF;--sky:#62C7FF;--sun:#FFD54A;
  --muted:#5f5a52;--line:#14141422;--r:20px;--b:2.5px solid var(--ink);--sh:4px 4px 0 var(--ink);--sh-sm:2px 2px 0 var(--ink);
  --font:'Bricolage Grotesque','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  background-image:radial-gradient(#14141418 1.2px,transparent 1.2px);background-size:20px 20px;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:-.02em}
.wrap{max-width:940px;margin:0 auto;padding:14px 16px 120px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.center{text-align:center}
.hide{display:none!important}
.mt{margin-top:14px}.mt2{margin-top:24px}
.big{font-size:clamp(34px,8vw,64px);font-weight:800;letter-spacing:-.04em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--b);border-radius:14px;padding:12px 18px;font-weight:800;
  background:var(--card);color:var(--ink);box-shadow:var(--sh);cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s;text-decoration:none;white-space:nowrap;min-height:48px;font-size:15px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
.btn.lime{background:var(--lime)}.btn.pink{background:var(--pink);color:#fff}.btn.violet{background:var(--violet);color:#fff}
.btn.sun{background:var(--sun)}.btn.sky{background:var(--sky)}.btn.ink{background:var(--ink);color:#fff}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:12px;box-shadow:var(--sh-sm)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:inherit}
.btn.ghost:hover{background:#14141410;transform:none}
.btn.block{width:100%}
.iconbtn{width:42px;height:42px;padding:0;min-height:0;border-radius:12px;box-shadow:var(--sh-sm)}

/* cards & inputs */
.card{background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card.lime{background:var(--lime)}.card.sun{background:var(--sun)}.card.sky{background:var(--sky)}.card.pink{background:#FFD3E0}.card.violet{background:#E3DCFF}
input,textarea,select{font:inherit;font-size:16px;border:var(--b);border-radius:14px;padding:12px 14px;width:100%;background:#fff;color:var(--ink);outline:none;transition:box-shadow .12s}
input:focus,textarea:focus,select:focus{box-shadow:4px 4px 0 var(--violet)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;border:0;box-shadow:none!important;accent-color:var(--violet);flex:none;margin:0}
textarea{resize:vertical;min-height:120px;line-height:1.45}
label.lbl{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
.field{position:relative}
.field .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer;padding:6px}
.err{color:#C4113F;font-weight:700;font-size:14px;min-height:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;background:#fff;white-space:nowrap}
.pill.lime{background:var(--lime)}.pill.pink{background:var(--pink);color:#fff}.pill.sun{background:var(--sun)}.pill.violet{background:var(--violet);color:#fff}.pill.sky{background:var(--sky)}.pill.ink{background:var(--ink);color:#fff}
.chip{border:2px solid var(--ink);border-radius:999px;padding:7px 12px;background:#fff;font-weight:700;cursor:pointer;font-size:14px;transition:background .12s}
.chip.on{background:var(--ink);color:#fff}
.chip:hover{background:#14141410}.chip.on:hover{background:var(--ink)}
.sticker{display:inline-block;transform:rotate(-3deg);background:var(--lime);border:var(--b);border-radius:12px;padding:2px 10px;box-shadow:var(--sh-sm)}
hr.dash{border:0;border-top:2px dashed var(--line);margin:16px 0}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:#FFF6E9e8;backdrop-filter:blur(8px);border-bottom:2px solid var(--ink)}
.top .in{max-width:940px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer}
.logo .mark{width:34px;height:34px;border:var(--b);border-radius:10px;background:var(--lime);display:grid;place-items:center;font-size:13px;font-weight:900;box-shadow:var(--sh-sm);transform:rotate(-6deg)}
.logo b{color:var(--pink)}
.avatar{width:42px;height:42px;border-radius:50%;border:var(--b);background:var(--sun);font-weight:900;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh-sm)}

/* bottom nav */
.nav{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;display:flex;gap:4px;background:var(--ink);padding:6px;border-radius:999px;box-shadow:0 10px 30px #0004}
.nav button{border:0;background:transparent;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative}
.nav button .e{font-size:19px;line-height:1}
.nav button.on{background:var(--lime);color:var(--ink)}
.nav button.plus{background:var(--pink);color:#fff}
.nav button .t{display:none}
.nav .badge{position:absolute;top:2px;right:2px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
@media(min-width:700px){.nav button .t{display:inline}}

/* offline */
.offline{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:100;background:var(--pink);color:#fff;text-align:center;font-weight:800;padding:6px 14px;font-size:13px;border:2px solid var(--ink);border-radius:999px;box-shadow:var(--sh-sm);width:max-content;max-width:92vw}

/* auth */
.hero{display:grid;gap:22px;align-items:center;padding-top:10px}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr;padding-top:40px}}
.hero h1{font-size:clamp(52px,13vw,104px);font-weight:800;letter-spacing:-.06em;line-height:.88}
.hero h1 .bang{color:var(--pink);display:inline-block;transform:rotate(8deg)}
.floaty{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
.tabs{display:flex;background:#14141410;border-radius:14px;padding:4px;gap:4px;border:2px solid var(--ink)}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;background:transparent;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.feat{display:flex;gap:8px;flex-wrap:wrap}

/* dashboard */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.newcard{border:3px dashed var(--ink);border-radius:var(--r);min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer;background:#ffffff80;transition:background .15s,transform .15s;font-weight:800;padding:16px}
.newcard:hover{background:var(--lime);transform:rotate(-1deg)}
.newcard .plusbig{font-size:44px;line-height:1}
.cvcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:150px;transition:transform .12s}
.cvcard:hover{transform:translate(-2px,-2px) rotate(.4deg)}
.cvcard h3{font-size:19px;word-break:break-word}
.meter{display:flex;gap:6px}
.meter i{width:26px;height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.meter i.f{background:var(--pink)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner .em{font-size:30px}

/* builder */
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps span{flex:1;height:8px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.steps span.on{background:var(--violet)}
.steps span.done{background:var(--lime)}
.qtitle{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.04em}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:4px 6px 8px 2px}
.cbtn{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:10px;font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left;font-size:14px}
.cbtn .f{font-size:22px}
.cbtn.on{background:var(--lime);box-shadow:var(--sh-sm)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{cursor:pointer;text-align:left;transition:transform .12s}
.opt:hover{transform:rotate(-1deg)}
.opt.on{background:var(--lime)}
.opt .e{font-size:36px}
.drop{display:block;border:3px dashed var(--ink);border-radius:var(--r);padding:32px 20px;text-align:center;background:#fff;cursor:pointer;transition:background .15s,transform .15s}
.drop:hover{background:var(--lime);transform:rotate(-.5deg)}
.drop b{display:block;font-size:19px;margin:6px 0 2px}
.drop.over{background:var(--sky)}


/* editor */
.composer{display:flex;gap:8px;align-items:center}
.edbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.edbar::-webkit-scrollbar{display:none}
.score{display:flex;gap:14px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;border:var(--b);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;
  background:conic-gradient(var(--c,var(--lime)) calc(var(--p)*1%),#fff 0)}
.ring b{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:17px}
.paperwrap{position:relative;width:100%;overflow:hidden;border-radius:12px}
.paper{position:absolute;top:0;left:0;transform-origin:top left;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:#fff}
.paper.editing{outline:4px dashed var(--violet);outline-offset:6px}
.paper .pb{position:absolute;left:0;right:0;border-top:2px dashed var(--pink);pointer-events:none}
.paper .pb::after{content:attr(data-l);position:absolute;right:6px;top:-22px;font:700 11px Inter,sans-serif;color:var(--pink);background:#fff;padding:2px 6px;border-radius:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ink)}
.kw{display:flex;gap:6px;flex-wrap:wrap}

/* modal */
.mbg{position:fixed;inset:0;background:#14141480;z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:fade .15s}
@media(min-width:640px){.mbg{align-items:center}}
.modal{background:var(--bg);border:var(--b);border-radius:24px;box-shadow:6px 6px 0 var(--ink);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:22px;animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
.modal.wide{max-width:720px}
.modal h2{font-size:28px;font-weight:800;margin-bottom:8px}
.modal .em{font-size:52px;line-height:1;margin-bottom:6px}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* toasts */
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;box-shadow:4px 4px 0 var(--pink);animation:pop .2s;pointer-events:auto;font-size:15px}
.toast.ok{box-shadow:4px 4px 0 var(--lime)}

/* loader */
.loader{position:fixed;inset:0;z-index:250;background:var(--lime);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.loader .blob{width:110px;height:110px;border:var(--b);border-radius:30px;background:#fff;display:grid;place-items:center;font-size:54px;box-shadow:var(--sh);animation:wob 1.2s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(.95)}}
.loader .line{font-size:clamp(20px,5vw,30px);font-weight:800;max-width:560px;min-height:2.4em}
.bar{width:min(320px,80vw);height:14px;border:var(--b);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--ink);border-radius:999px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

/* key / pro */
.stepn{width:34px;height:34px;flex:none;border-radius:50%;border:var(--b);background:var(--sun);display:grid;place-items:center;font-weight:900}
.qrimg{width:100%;max-width:300px;border:var(--b);border-radius:18px;background:#fff;display:block;margin:0 auto;cursor:zoom-in}
.price{font-size:clamp(46px,12vw,80px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.num{font-family:Inter,sans-serif;font-weight:700;letter-spacing:.02em}

/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:14px}
.stat b{font-size:30px;display:block;font-weight:800}
.req{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px}
.req input[type=checkbox]{width:22px;height:22px;accent-color:var(--violet)}
.req .acts{display:flex;gap:6px}
.warn{background:#FFD3E0;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;font-size:12px;font-weight:800;display:inline-block}
.bulk{position:sticky;bottom:86px;z-index:30}
.ulist .req{grid-template-columns:1fr auto}

/* ============ CV PAPER ============ */
.cv{width:794px;min-height:1123px;padding:53px;background:#fff;color:#1d1d1f;font:12.5px/1.5 Inter,Arial,sans-serif;--a:var(--cv-acc,#1F3A5F);text-align:left;letter-spacing:0}
.cv *{box-sizing:border-box}
.cv h1{font-size:30px;font-weight:700;letter-spacing:-.01em;color:#111;margin:0;line-height:1.15}
.cv .cv-head{font-size:14.5px;color:var(--a);font-weight:600;margin-top:3px}
.cv .cv-contact{margin-top:8px;color:#444;font-size:12px;word-break:break-word}
.cv .cv-contact a{color:#444;text-decoration:none}
.cv .cv-sec{margin-top:16px}
.cv h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--a);font-weight:700;margin:0 0 7px;padding-bottom:4px;border-bottom:1.5px solid var(--a);line-height:1.3}
.cv p{margin:0}
.cv ul{margin:4px 0 0;padding-left:17px}
.cv li{margin:2px 0}
.cv .cv-item{margin-bottom:10px;break-inside:avoid}
.cv table.cv-row{width:100%;border-collapse:collapse}
.cv table.cv-row td{padding:0;vertical-align:baseline}
.cv .cv-date{text-align:right;white-space:nowrap;color:#555;font-size:11.5px;padding-left:10px!important}
.cv .cv-at{color:#333}
.cv .cv-sub{color:#666;font-size:11.5px}
.cv .cv-skill{margin:2px 0}
.cv dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:0}
.cv dt{font-weight:600;color:#333}.cv dd{margin:0}
.cv .cv-foot{margin-top:22px;font-size:9.5px;color:#666;font-style:italic;border-top:1px solid #ddd;padding-top:8px}
.cv .cv-photo{width:110px;height:130px;object-fit:cover;border-radius:6px;display:block;flex:none}
.cv mark.ph{background:#FFF09A;color:#111;padding:0 2px;border-radius:3px}
.cv .tags span{display:inline-block;border:1px solid #cfd6df;border-radius:4px;padding:1px 7px;margin:0 4px 4px 0;font-size:11.5px}
/* uk */
.cv.t-uk{font-family:Inter,Arial,sans-serif}
.cv.t-uk h1,.cv.t-uk h3{font-family:Lora,Georgia,serif}
.cv.t-uk header{text-align:center}
.cv.t-uk h1{font-size:32px}
.cv.t-uk h3{text-transform:none;letter-spacing:0;font-size:16px;border-bottom:1px solid #bbb;color:#111}
.cv.t-uk .cv-head{color:#444;font-style:italic}
/* gulf */
.cv.t-gulf header{display:flex;gap:20px;align-items:center;background:var(--a);color:#fff;border-radius:10px;padding:20px 22px}
.cv.t-gulf header h1{color:#fff}
.cv.t-gulf header .cv-head{color:#fff;opacity:.9}
.cv.t-gulf header .cv-contact,.cv.t-gulf header .cv-contact a{color:#fff;opacity:.85}
.cv.t-gulf header .cv-photo{border:3px solid #fff;width:100px;height:118px}
.cv.t-gulf .pbox{background:#f4f6f9;border-radius:8px;padding:10px 14px;margin-top:14px}
/* south */
.cv.t-south header{display:flex;gap:20px;align-items:center;padding-bottom:12px;border-bottom:3px solid var(--a)}
.cv.t-south h3{background:var(--a);color:#fff;border:0;padding:4px 10px;border-radius:4px;font-size:11.5px}
/* euro */
.cv.t-euro{padding:0;display:grid;grid-template-columns:250px 1fr}
.cv.t-euro aside{background:color-mix(in srgb,var(--a) 9%,#fff);padding:40px 22px;border-right:3px solid var(--a)}
.cv.t-euro main{padding:40px 34px}
.cv.t-euro aside .cv-photo{width:150px;height:170px;margin:0 auto 18px;border-radius:10px}
.cv.t-euro aside h3{font-size:11px}
.cv.t-euro aside .cv-sec{margin-top:18px}
.cv.t-euro aside .ci{margin:4px 0;word-break:break-word;font-size:11.5px}
.cv.t-euro aside dl{grid-template-columns:1fr;gap:0}
.cv.t-euro aside dt{font-size:10.5px;color:#666;font-weight:600;margin-top:6px}
.cv.t-euro main{display:flex;flex-direction:column}
.cv.t-euro main .cv-foot{margin-top:auto;padding-top:8px}
.cv.t-euro main>section:last-of-type{margin-bottom:22px}

/* print */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .cv{width:auto;min-height:0;padding:0;box-shadow:none}
  #printArea .cv.t-euro{padding:0}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="offline" class="offline hide">📡 Offline — changes will sync when you're back</div>
<header class="top hide" id="topbar">
  <div class="in">
    <a class="logo" href="#/"><span class="mark">CV</span><span>Banao<b>!</b></span></a>
    <span class="grow"></span>
    <span id="planPill"></span>
    <button class="avatar" id="avatarBtn" aria-label="Account">?</button>
  </div>
</header>
<div class="wrap" id="view"></div>
<nav class="nav hide" id="nav"></nav>
<div id="modalRoot"></div>
<div id="toasts"></div>
<div id="printArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

function modal({ em = "", title = "", html = "", actions = [], wide = false, dismiss = true, onClose }) {
  const bg = document.createElement("div");
  bg.className = "mbg";
  bg.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">
    ${em ? `<div class="em">${em}</div>` : ""}${title ? `<h2>${title}</h2>` : ""}
    <div class="mbody">${html}</div>
    ${actions.length ? `<div class="row wrapf mt2 macts" style="justify-content:flex-end"></div>` : ""}
  </div>`;
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === "Escape" && dismiss) close(); };
  document.addEventListener("keydown", onKey);
  if (dismiss) bg.addEventListener("click", e => { if (e.target === bg) close(); });
  actions.forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.cls || "");
    b.innerHTML = a.label;
    b.onclick = async () => { if (a.onClick) { const r = await a.onClick(b, bg); if (r === false) return; } close(); };
    $(".macts", bg).appendChild(b);
  });
  $("#modalRoot").appendChild(bg);
  return { el: bg, close };
}

function confetti() {
  const c = document.createElement("canvas");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:400";
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext("2d"), cols = ["#C8F55A", "#FF5C8A", "#7B61FF", "#62C7FF", "#FFD54A", "#141414"];
  const P = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 16, vy: Math.random() * -14 - 4, s: Math.random() * 8 + 5, c: pick(cols), r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 170) requestAnimationFrame(loop); else c.remove();
  })();
}

function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach((fq, i) => { const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = fq; const t = a.currentTime + i * .15; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.start(t); o.stop(t + .25); });
  } catch {}
}

async function copyText(t, label = "Copied!") {
  try { await navigator.clipboard.writeText(t); toast("📋 " + label, true); }
  catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("📋 " + label, true); } catch { toast("Couldn't copy. Long-press to copy manually."); } ta.remove(); }
}

function aiError(status, body, provider) {
  const raw = body?.error?.message || body?.error?.type || body?.message || ("HTTP " + status);
  let m;
  if (status === 401 || status === 403 || /API key not valid|API_KEY_INVALID|invalid x-api-key|Incorrect API key/i.test(raw)) m = "🔑 Your API key got rejected. Re-check it in Key settings.";
  else if (status === 429 || /quota|rate/i.test(raw)) m = "🐢 Your key hit its rate limit/quota. Wait a minute (free tiers are shy) and retry.";
  else if (/location is not supported/i.test(raw)) m = "🌏 Google says this key can't be used from your region. Try another provider.";
  else if (/credit|billing|insufficient/i.test(raw)) m = "💸 Your " + (PROVIDERS[provider]?.name || "AI") + " account needs billing credit.";
  else if (status === 404) m = "🤷 That model isn't available for your key. Pick another model in Key settings.";
  else if (status >= 500) m = `🤖 Google/AI servers are overloaded right now (${status}). Wait a minute and retry, or pick another model in AI Key.`;
  else m = "😵 AI said: " + raw;
  const e = new Error(m); e.status = status; e.raw = raw; e.ai = true; return e;
}
async function aiFetch(url, opts, provider, timeout = 150000) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout);
  try {
    let r = await fetch(url, { ...opts, signal: ctl.signal });
    if ([500, 502, 503, 504, 529].includes(r.status)) { await sleep(2500); r = await fetch(url, { ...opts, signal: ctl.signal }); }
    let body = null; try { body = await r.json(); } catch {}
    if (!r.ok) { console.error("AI error", r.status, body); throw aiError(r.status, body, provider); }
    return body;
  } catch (e) {
    if (e.ai) throw e;
    if (e.name === "AbortError") throw new Error("⏰ The AI took too long. Try again (maybe a shorter input).");
    throw new Error("📡 Couldn't reach the AI. Check internet / VPN / ad-blocker.");
  } finally { clearTimeout(tm); }
}

// messages: [{role:'user'|'assistant', text}]
async function ai({ system, messages, json = false, file = null, fast = false, timeout = 150000 }) {
  const k = S.keyInfo;
  if (!k?.key) throw new Error("🔑 Add your AI key first.");
  if (k.provider === "gemini") {
    const contents = messages.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.text }] }));
    if (file) contents[contents.length - 1].parts.push({ inlineData: { mimeType: file.mime, data: file.b64 } });
    // Try the chosen model first; if Google says it's busy (503/500/429/404), fall back to other models from the key's list.
    const order = geminiOrder(k);
    let j, used, lastErr;
    for (const model of order) {
      const gen = { temperature: 0.6, ...(json ? { responseMimeType: "application/json" } : {}) };
      const major = parseInt((model.match(/gemini-(\d+)/) || [0, 0])[1]) || 0;
      if (fast && major >= 3) gen.thinkingConfig = { thinkingLevel: "low" };   // quick replies for chat
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(k.key)}`;
      const send = () => aiFetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents, generationConfig: gen }) }, "gemini", timeout);
      try {
        try { j = await send(); }
        catch (e) { if (gen.thinkingConfig && e.status === 400) { delete gen.thinkingConfig; j = await send(); } else throw e; }
        used = model; break;
      } catch (e) {
        lastErr = e;
        if (!(e.status >= 500 || e.status === 429 || e.status === 404)) throw e;   // bad key etc. → stop
      }
    }
    if (!used) throw lastErr;
    if (used !== k.model && S.busyModelNote !== used) { S.busyModelNote = used; toast(`🐢 ${k.model} is busy — used ${used} instead`); }
    S.liveModel = used;   // start with the model that worked, for the rest of this session
    const cand = j.candidates?.[0];
    const txt = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
    if (!txt) throw new Error(j.promptFeedback?.blockReason || cand?.finishReason === "SAFETY" ? "🙈 The AI refused this one (safety filter). Rephrase a bit and retry." : "🤐 The AI returned nothing. Try again.");
    return txt;
  }
  if (k.provider === "openai") {
    const body = { model: k.model, messages: [{ role: "system", content: system }, ...messages.map(m => ({ role: m.role, content: m.text }))], ...(json ? { response_format: { type: "json_object" } } : {}) };
    const j = await aiFetch("https://api.openai.com/v1/chat/completions", { method: "POST", headers: { "content-type": "application/json", Authorization: "Bearer " + k.key }, body: JSON.stringify(body) }, "openai", timeout);
    const t = j.choices?.[0]?.message?.content; if (!t) throw new Error("🤐 The AI returned nothing. Try again."); return t;
  }
  const body = { model: k.model, max_tokens: 8000, system, messages: messages.map(m => ({ role: m.role, content: m.text })) };
  const j = await aiFetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: claudeHeaders(k.key), body: JSON.stringify(body) }, "claude", timeout);
  const t = (j.content || []).filter(b => b.type === "text").map(b => b.text).join(""); if (!t) throw new Error("🤐 The AI returned nothing. Try again."); return t;
}

function geminiOrder(k) {
  const all = [...new Set([...(k.models || []), "gemini-flash-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"])];
  const okName = m => /flash/.test(m) && !/(preview|exp|thinking|8b|image|tts|live)/.test(m);
  const fallbacks = all.filter(m => m !== k.model && okName(m))
    .sort((x, y) => (/lite/.test(x) - /lite/.test(y)) || (ver(y) - ver(x)))   // full flash first (newest → older), lite last
    .slice(0, 4);
  const first = S.liveModel && S.liveModel !== k.model ? [S.liveModel] : [];
  return [...new Set([...first, k.model, ...fallbacks])];
}

function parseJSON(t) {
  t = String(t || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  const e = new Error("bad json"); e.badJson = true; throw e;
}

function normCV(c) {
  c = c && typeof c === "object" ? c : {};
  const arr = x => Array.isArray(x) ? x : [];
  const str = x => x == null ? "" : (typeof x === "object" ? Object.values(x).filter(Boolean).join(" — ") : String(x));
  c.meta = c.meta && typeof c.meta === "object" ? c.meta : {};
  c.meta.matchScore = Math.max(0, Math.min(100, parseInt(c.meta.matchScore) || 0));
  c.meta.missingKeywords = arr(c.meta.missingKeywords).map(str).filter(Boolean).slice(0, 10);
  c.meta.tips = arr(c.meta.tips).map(str).filter(Boolean).slice(0, 5);
  ["jobTitle", "company", "roast"].forEach(k => c.meta[k] = str(c.meta[k]));
  c.labels = c.labels && typeof c.labels === "object" ? c.labels : {};
  c.basics = c.basics && typeof c.basics === "object" ? c.basics : {};
  ["name", "headline", "email", "phone", "location"].forEach(k => c.basics[k] = str(c.basics[k]));
  c.basics.links = arr(c.basics.links).map(l => typeof l === "string" ? { label: "", url: l } : { label: str(l?.label), url: str(l?.url) }).filter(l => l.url || l.label);
  c.personal = arr(c.personal).map(p => ({ label: str(p?.label), value: str(p?.value) })).filter(p => p.value);
  c.summary = str(c.summary);
  let sk = arr(c.skills);
  if (sk.length && sk.every(s => typeof s === "string")) sk = [{ group: "", items: sk }];
  c.skills = sk.map(s => typeof s === "string" ? { group: "", items: [s] } : { group: str(s?.group), items: arr(s?.items).map(str).filter(Boolean) }).filter(s => s.items.length);
  c.experience = arr(c.experience).filter(Boolean).map(e => ({ role: str(e.role), company: str(e.company), location: str(e.location), start: str(e.start), end: str(e.end), bullets: arr(e.bullets).map(str).filter(Boolean) }));
  c.education = arr(c.education).filter(Boolean).map(e => ({ degree: str(e.degree), school: str(e.school), location: str(e.location), start: str(e.start), end: str(e.end), details: str(e.details) }));
  c.projects = arr(c.projects).filter(Boolean).map(p => typeof p === "string" ? { name: p, description: "", link: "" } : { name: str(p.name), description: str(p.description), link: str(p.link) });
  c.certifications = arr(c.certifications).filter(Boolean).map(p => typeof p === "string" ? { name: p, issuer: "", date: "" } : { name: str(p.name), issuer: str(p.issuer), date: str(p.date) });
  c.languages = arr(c.languages).filter(Boolean).map(l => typeof l === "string" ? { name: l, level: "" } : { name: str(l.name), level: str(l.level) });
  c.awards = arr(c.awards).map(str).filter(Boolean);
  c.extra = arr(c.extra).filter(x => x && x.title).map(x => ({ title: str(x.title), items: arr(x.items).map(str).filter(Boolean) })).filter(x => x.items.length);
  c.footer = str(c.footer);
  return c;
}

/* ================= CV RENDER ================= */
const T = s => esc(s).replace(/\[([^\]\n]{1,40})\]/g, '<mark class="ph">[$1]</mark>');
const DEF_LABELS = { summary: "Summary", experience: "Experience", education: "Education", skills: "Skills", projects: "Projects", certifications: "Certifications", languages: "Languages", awards: "Awards", personal: "Personal Details" };
const range = (a, b) => [a, b].filter(Boolean).join(" – ");
const safeUrl = u => /^https?:\/\//i.test(u) ? u : (/^[\w.-]+\.[a-z]{2,}/i.test(u) ? "https://" + u : "");

function renderCV(cv, tpl, photo) {
  const b = cv.basics, L = { ...DEF_LABELS }; Object.entries(cv.labels || {}).forEach(([k, v]) => { if (v) L[k] = v; });
  const sec = (title, inner) => inner ? `<section class="cv-sec"><h3>${T(title)}</h3>${inner}</section>` : "";
  const ul = a => a?.length ? `<ul>${a.map(x => `<li>${T(x)}</li>`).join("")}</ul>` : "";
  const row = (left, right) => `<table class="cv-row"><tr><td>${left}</td><td class="cv-date">${right}</td></tr></table>`;
  const linkHtml = l => { const u = safeUrl(l.url); const txt = T(l.url || l.label); return u ? `<a href="${esc(u)}">${txt}</a>` : txt; };
  const contactBits = [b.email, b.phone, b.location].filter(Boolean).map(T).concat(b.links.map(linkHtml));
  const photoImg = PHOTO_TPL[tpl] && photo ? `<img class="cv-photo" src="${esc(photo)}" alt="">` : "";

  const summary = cv.summary ? sec(L.summary, `<p>${T(cv.summary)}</p>`) : "";
  const exp = cv.experience.length ? sec(L.experience, cv.experience.map(e => `<div class="cv-item">${row(`<b>${T(e.role)}</b>${e.company ? ` <span class="cv-at">· ${T(e.company)}</span>` : ""}`, T(range(e.start, e.end)))}${e.location ? `<div class="cv-sub">${T(e.location)}</div>` : ""}${ul(e.bullets)}</div>`).join("")) : "";
  const edu = cv.education.length ? sec(L.education, cv.education.map(e => `<div class="cv-item">${row(`<b>${T(e.degree)}</b>${e.school ? ` <span class="cv-at">· ${T(e.school)}</span>` : ""}`, T(range(e.start, e.end)))}${e.location ? `<div class="cv-sub">${T(e.location)}</div>` : ""}${e.details ? `<div>${T(e.details)}</div>` : ""}</div>`).join("")) : "";
  const skillsList = cv.skills.length ? cv.skills.map(s => `<div class="cv-skill">${s.group ? `<b>${T(s.group)}:</b> ` : ""}${s.items.map(T).join(", ")}</div>`).join("") : "";
  const skillsTags = cv.skills.length ? cv.skills.map(s => `${s.group ? `<div style="font-weight:600;margin:6px 0 3px">${T(s.group)}</div>` : ""}<div class="tags">${s.items.map(i => `<span>${T(i)}</span>`).join("")}</div>`).join("") : "";
  const proj = cv.projects.length ? sec(L.projects, cv.projects.map(p => `<div class="cv-item"><b>${T(p.name)}</b>${p.link ? ` <span class="cv-sub">· ${linkHtml({ url: p.link })}</span>` : ""}${p.description ? `<div>${T(p.description)}</div>` : ""}</div>`).join("")) : "";
  const certs = cv.certifications.length ? sec(L.certifications, ul(cv.certifications.map(c => [c.name, c.issuer, c.date].filter(Boolean).join(" · ")))) : "";
  const langsTxt = cv.languages.map(l => `${l.name}${l.level ? " — " + l.level : ""}`);
  const langs = cv.languages.length ? sec(L.languages, `<div>${langsTxt.map(T).join(" · ")}</div>`) : "";
  const awards = cv.awards.length ? sec(L.awards, ul(cv.awards)) : "";
  const extra = cv.extra.map(x => sec(x.title, ul(x.items))).join("");
  const personalDl = cv.personal.length ? `<dl>${cv.personal.map(p => `<dt>${T(p.label)}</dt><dd>${T(p.value)}</dd>`).join("")}</dl>` : "";
  const foot = cv.footer ? `<footer class="cv-foot">${T(cv.footer)}</footer>` : "";
  const nameBlock = `<h1>${T(b.name || "Your Name")}</h1>${b.headline ? `<div class="cv-head">${T(b.headline)}</div>` : ""}`;
  const contactLine = contactBits.length ? `<div class="cv-contact">${contactBits.join(" &nbsp;·&nbsp; ")}</div>` : "";

  if (tpl === "euro") {
    const contactSide = contactBits.length ? `<section class="cv-sec"><h3>Contact</h3>${contactBits.map(c => `<div class="ci">${c}</div>`).join("")}</section>` : "";
    return `<div class="cv t-euro"><aside>${photoImg}${contactSide}${personalDl ? sec(L.personal, personalDl) : ""}${skillsTags ? sec(L.skills, skillsTags) : ""}${cv.languages.length ? sec(L.languages, langsTxt.map(t => `<div class="ci">${T(t)}</div>`).join("")) : ""}</aside>
      <main><header>${nameBlock}</header>${summary}${exp}${edu}${proj}${certs}${awards}${extra}${foot}</main></div>`;
  }
  if (tpl === "gulf") {
    return `<div class="cv t-gulf"><header><div class="grow" style="flex:1">${nameBlock}${contactLine}</div>${photoImg}</header>
      ${personalDl ? `<div class="pbox">${personalDl}</div>` : ""}${summary}${exp}${skillsList ? sec(L.skills, skillsList) : ""}${edu}${proj}${certs}${langs}${awards}${extra}${foot}</div>`;
  }
  if (tpl === "south") {
    return `<div class="cv t-south"><header>${photoImg}<div style="flex:1">${nameBlock}${contactLine}</div></header>
      ${summary}${exp}${edu}${skillsList ? sec(L.skills, skillsList) : ""}${proj}${certs}${langs}${awards}${extra}${personalDl ? sec(L.personal, personalDl) : ""}${foot}</div>`;
  }
  return `<div class="cv t-${tpl === "uk" ? "uk" : "ats"}"><header>${nameBlock}${contactLine}</header>
    ${summary}${skillsList ? sec(L.skills, skillsList) : ""}${exp}${edu}${proj}${certs}${langs}${awards}${extra}${personalDl ? sec(L.personal, personalDl) : ""}${foot}</div>`;
}

function sanitize(html) {
  const d = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  d.querySelectorAll("script,iframe,object,embed,style,link,meta,form").forEach(n => n.remove());
  d.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => {
    if (/^on/i.test(a.name) || (/^(href|src)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
  }));
  return d.body.firstChild.innerHTML;
}

  const local = lsGet(devKeyName());
  if (local?.key) { S.keyInfo = { ...local, where: "device" }; return; }
  try { const s = await withTimeout(get(R("secrets/" + S.user.uid)), 10000, "timeout"); S.keyInfo = s.exists() ? { ...s.val(), where: "cloud" } : null; }
  catch { S.keyInfo = null; }
}
async function saveKey(info, where) {
  const uid = S.user.uid;
  if (where === "device") {
    if (!lsSet(devKeyName(), info)) throw new Error("Your browser blocked local storage. Use “Sync to account”.");
    await remove(R("secrets/" + uid)).catch(() => {});
  } else {
    await set(R("secrets/" + uid), { ...info, updatedAt: serverTimestamp() });
    lsSet(devKeyName(), null);
  }
  S.keyInfo = { ...info, where };
}
async function removeKey() { lsSet(devKeyName(), null); await remove(R("secrets/" + S.user.uid)).catch(() => {}); S.keyInfo = null; }
const mask = k => k ? k.slice(0, 4) + "••••••••" + k.slice(-4) : "";

onValue(ref(db, ".info/connected"), s => {

onAuthStateChanged(auth, async user => {

  Object.assign(S, { user, profile: null, request: null, cvs: {}, keyInfo: null, profileLoaded: false, prevPlan: null, prevReqStatus: null, adminReqs: {}, adminUsers: {}, adminSeen: null, fileInline: null, draft: null });

  }, e => { console.error(e); showDbError(e); }));
  S.unsubs.push(onValue(R("requests/" + uid), s => {
    const r = s.val(); const was = S.prevReqStatus; S.request = r; S.prevReqStatus = r?.status || null;
    if (was === "pending" && r?.status === "rejected") modal({ em: "🧐", title: "Upgrade not approved", html: `<p>${esc(r.note || "We couldn't verify that payment.")}</p><p class="muted small">Double-check your TrxID and try again.</p>`, actions: [{ label: "Fix it", cls: "lime", onClick: () => { location.hash = "#/pro"; } }] });
    rerender(["", "pro"]);
  }, e => console.error("requests listener:", e)));
  S.unsubs.push(onValue(R("cvs/" + uid), s => { S.cvs = s.val() || {}; rerender([""]); }, e => { console.error(e); toast(dbErr(e)); }));
  setTimeout(() => { if (S.user && S.user.uid === uid && !S.profileLoaded) showDbError(Object.assign(new Error("Your profile didn't load in 15 seconds."), { code: "TIMEOUT" })); }, 15000);
  if (S.isAdmin) startAdminFeed();
  route();
});

async function ensureProfile(user) {
  const uid = user.uid, snap = await get(R("users/" + uid)), p = snap.val() || {}, u = {};
  if (!p.email) u[`users/${uid}/email`] = (user.email || "").toLowerCase();
  if (!p.name) u[`users/${uid}/name`] = (user.displayName || (user.email || "").split("@")[0]).slice(0, 80);
  if (!p.plan) u[`users/${uid}/plan`] = "free";
  if (p.cvCount == null) u[`users/${uid}/cvCount`] = 0;
  if (!p.createdAt) u[`users/${uid}/createdAt`] = serverTimestamp();
  if (Object.keys(u).length) await update(R(), u);
}

function celebratePro() {
  confetti();
  modal({ em: "😎", title: "You're PRO now!", html: `<p>Payment verified. Unlimited CVs unlocked. Go apply to <i>everything</i>. 🚀</p>`, actions: [{ label: "Make a CV ➕", cls: "lime", onClick: () => { location.hash = "#/new"; } }] });
}

/* ================= ADMIN FEED (notifications) ================= */
function startAdminFeed() {
  S.unsubs.push(onValue(R("requests"), s => {
    S.adminReqs = s.val() || {};
    const pending = Object.entries(S.adminReqs).filter(([, r]) => r.status === "pending");
    const ids = new Set(pending.map(([u, r]) => u + ":" + r.trxId));
    if (S.adminSeen === null) {
      if (pending.length) toast(`🔔 ${pending.length} upgrade request${pending.length > 1 ? "s" : ""} waiting`);
    } else {
      const fresh = pending.filter(([u, r]) => !S.adminSeen.has(u + ":" + r.trxId));
      if (fresh.length) {
        beep();
        const [, r] = fresh[0];
        toast(`🔔 New upgrade request: ${r.email} · ${r.trxId}`);
        try { if ("Notification" in window && Notification.permission === "granted") new Notification("CV Banao! – new upgrade request", { body: `${r.email} sent ৳${PRICE} · TrxID ${r.trxId}` }); } catch {}
      }
    }
    S.adminSeen = ids;
    document.title = (pending.length ? `(${pending.length}) ` : "") + "CV Banao!";
    refreshChrome(); rerender(["admin"]);
  }, e => toast(dbErr(e))));
  S.unsubs.push(onValue(R("users"), s => { S.adminUsers = s.val() || {}; rerender(["admin"]); }, () => {}));
}

    actions: [{ label: "🔁 Reset password", cls: "sm", onClick: async () => { try { await sendPasswordResetEmail(auth, S.user.email); toast("📬 Reset link sent to your email", true); } catch (e) { toast(authMsg(e)); } } },
              { label: "👋 Log out", cls: "pink sm", onClick: () => { flushEditor(); signOut(auth); location.hash = "#/"; } }] });
};
window.addEventListener("hashchange", () => { flushEditor(); route(); });

function route() {
  refreshChrome();
  if (!S.user) return renderAuth();
  if (!S.profileLoaded) return;
  const { r, id } = curRoute();
  if (r !== "cv") S.editor = null;

const draftKey = () => "cvb_draft_" + S.user.uid;

/* --- file reading --- */
const scripts = {};
const loadScript = src => scripts[src] || (scripts[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete scripts[src]; rej(new Error("Couldn't load the file reader. Check internet.")); }; document.head.appendChild(s); }));
const toB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("Couldn't read file")); r.readAsDataURL(f); });
async function extractFile(f) {
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (f.size > 8 * 1024 * 1024) throw new Error("🐘 File too chunky. Max 8 MB.");
  if (f.size === 0) throw new Error("📭 That file is empty.");
  let text = "";
  if (ext === "txt" || ext === "md") text = await f.text();
  else if (ext === "pdf") {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    let pdf;
    try { pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise; }
    catch (e) { throw new Error(/password/i.test(e?.name + e?.message) ? "🔒 PDF is password-locked. Remove the password and retry." : "😵 That PDF seems broken. Try another file."); }
    for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      text += c.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("") + "\n\n";
    }
  } else if (ext === "docx") {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    try { text = (await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value; }
    catch { throw new Error("😵 Couldn't open that DOCX. Save as PDF and retry."); }
  } else if (ext === "doc") throw new Error("👴 Old .doc isn't supported. Save as .docx or PDF.");
  else if (!["jpg", "jpeg", "png", "webp"].includes(ext)) throw new Error("🤔 Unsupported file. Use PDF, DOCX or TXT.");
  text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim().slice(0, 30000);
  if (text.length >= 80) return { text };
  // scanned PDF / image
  if (S.keyInfo?.provider === "gemini" && (ext === "pdf" || ["jpg", "jpeg", "png", "webp"].includes(ext))) {
    if (f.size > 7 * 1024 * 1024) throw new Error("🐘 Scanned file too big for AI (max 7 MB).");
    const mime = ext === "pdf" ? "application/pdf" : ext === "jpg" ? "image/jpeg" : "image/" + ext;
    return { text: "", inline: { mime, b64: await toB64(f) } };
  }
  throw new Error("🖼️ This looks like a scanned image — no text inside. Use “Paste text”, or a Gemini key (it can read images).");
}

const COOK_LINES = ["Reading the job post like it's a love letter 💌", "Removing the word “hardworking” (everyone says it)…", "Translating “did stuff” into “spearheaded” 🚀", "Bribing the ATS robot with biryani 🍛", "Aligning bullets. Military precision. 🎖️", "Asking HR what they *actually* want…", "Adding seasoning. Not too much. 🧂", "Polishing until it sparkles ✨", "Almost there. Don't refresh, bhai 🙏"];

function buildUserPrompt(d) {
  const c = country(d.country);
  let src;
  if (d.mode === "upload" && !d.sourceText && S.fileInline) src = "The candidate's existing CV is attached as a file. Read it carefully.";
  else src = "CANDIDATE'S EXISTING CV / MATERIAL:\n" + d.sourceText;
  return `TODAY: ${today()}
TARGET COUNTRY: ${c.name}
COUNTRY CONVENTIONS: ${c.rules}
CV LANGUAGE: ${d.lang}
JOB DESCRIPTION:
"""${d.jd.slice(0, 15000)}"""

${src.slice(0, 30000)}
${d.notes.trim() ? "\nEXTRA NOTES FROM CANDIDATE (true, newer facts):\n" + d.notes.trim() : ""}

Return ONLY the JSON object.`;
}

async function aiCV(system, user, file) {
  try { return normCV(parseJSON(await ai({ system, messages: [{ role: "user", text: user }], json: true, file }))); }
  catch (e) {
    if (!e.badJson) throw e;
    const txt = await ai({ system, messages: [{ role: "user", text: user + "\n\nIMPORTANT: Your previous answer was not valid JSON. Return ONLY compact valid JSON, keep bullets concise." }], json: true, file });
    try { return normCV(parseJSON(txt)); } catch { throw new Error("🤪 The AI returned gibberish twice. Try again or pick another model in Key settings."); }
  }
}

async function generate() {
  const d = D();
  if (!S.online) return toast("📡 You're offline. Connect and retry.");
  if (!canCreate()) return paywall();
  if (!S.keyInfo) return needKey();
  showLoader(COOK_LINES);
  let cv;
  try { cv = await aiCV(CV_SYSTEM, buildUserPrompt(d), d.mode === "upload" && !d.sourceText ? S.fileInline : null); }
  catch (e) { hideLoader(); return modal({ em: "😵", title: "The pan caught fire", html: `<p>${esc(e.message)}</p>`, actions: [{ label: "Key settings", cls: "ghost", onClick: () => { location.hash = "#/key"; } }, { label: "Retry", cls: "lime", onClick: () => { generate(); } }] }); }
  if (!cv.basics.name && !cv.experience.length && !cv.summary) { hideLoader(); return modal({ em: "🫥", title: "Not enough info", html: "<p>The AI couldn't find much about you. Add more details and try again.</p>", actions: [{ label: "OK", cls: "lime" }] }); }
  const c = country(d.country);
  const rec = {
    title: ((cv.meta.jobTitle || "My CV") + (cv.meta.company ? " @ " + cv.meta.company : "")).slice(0, 120),
    country: c.code, lang: d.lang, tpl: c.tpl, accent: ACCENTS[0], jd: d.jd.slice(0, 20000), source: d.mode,
    data: JSON.stringify(cv), score: cv.meta.matchScore, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  };
  await saveNewCV(rec);
}

async function saveNewCV(rec) {
  const uid = S.user.uid;
  try {
    const fresh = (await get(R("users/" + uid))).val() || {}; S.profile = { ...S.profile, ...fresh };
    if (!canCreate()) { hideLoader(); return paywall(); }
    const id = push(R("cvs/" + uid)).key;
    const newCount = Number(fresh.cvCount || 0) + 1;
    await update(R(), { [`cvs/${uid}/${id}`]: rec, [`users/${uid}/cvCount`]: newCount });
    hideLoader();
    S.draft = newDraft(); S.fileInline = null; saveDraft();
    location.hash = "#/cv/" + id;
    confetti();
    setTimeout(() => afterBuildModal(newCount), 700);
  } catch (e) {
    hideLoader();
    if (/PERMISSION_DENIED/i.test(String(e?.code || e?.message))) return paywall();
    modal({ em: "💾", title: "Couldn't save", html: `<p>Your CV is ready but saving failed: ${esc(dbErr(e))}</p><p class="small muted">Don't close the tab — tap retry.</p>`, dismiss: false,
      actions: [{ label: "Retry save", cls: "lime", onClick: () => { showLoader(["Saving… 💾"]); saveNewCV(rec); } }] });
  }
}

function afterBuildModal(n) {
  if (isPro()) return toast("🎉 CV cooked! Hot & fresh.", true);

}

function drawPaper() {
  const E = S.editor; if (!E) return;
  const paper = $("#paper");
  paper.innerHTML = E.rec.html ? sanitize(E.rec.html) : renderCV(E.cv, E.rec.tpl, E.rec.photo);
  const inner = $(".cv", paper);
  if (inner) inner.addEventListener("input", () => { E.dirty = true; $("#saveSt").textContent = "Typing…"; clearTimeout(E.timer); E.timer = setTimeout(flushEditor, 1200); fitPaper(); });
  const ph = (paper.textContent.match(/\[[^\]\n]{1,40}\]/g) || []).length;
  $("#phNote").innerHTML = ph ? `🟨 ${ph} yellow <b>[placeholder${ph > 1 ? "s" : ""}]</b> — tap ✏️ Edit text and fill in your real numbers.` : "";
  fitPaper();
}
function fitPaper() {
  const p = $("#paper"), w = $("#pwrap"); if (!p || !w) return;
  const s = Math.min(1, w.clientWidth / 798);
  p.style.transform = `scale(${s})`;
  const h = Math.max(1123, ($(".cv", p)?.scrollHeight || 1123));
  $$(".pb", p).forEach(x => x.remove());
  for (let y = 53 + 1017, n = 2; y < h - 40; y += 1017, n++) { const l = document.createElement("div"); l.className = "pb"; l.style.top = y + "px"; l.dataset.l = "page " + n + " ↓ (approx.)"; p.appendChild(l); }
  w.style.height = (h + 8) * s + "px";
}
window.addEventListener("resize", () => S.editor && fitPaper());

function queueSave(patch) {
  const E = S.editor; if (!E) return;
  E.pending = { ...(E.pending || {}), ...patch };
  $("#saveSt").textContent = "Saving…";
  clearTimeout(E.ptimer); E.ptimer = setTimeout(() => { const p = E.pending; E.pending = null; saveNow(p); }, 900);
}
async function saveNow(patch) {
  const E = S.editor; if (!E) return;
  const st = $("#saveSt"); st && (st.textContent = "Saving…");
  try { await update(R(`cvs/${S.user.uid}/${E.id}`), { ...patch, updatedAt: serverTimestamp() }); st && (st.textContent = "Saved ✓"); }
  catch (e) { st && (st.textContent = "⚠️ Not saved"); toast(dbErr(e)); }
}
function flushEditor() {
  const E = S.editor; if (!E) return;
  if (E.pending) { const p = E.pending; E.pending = null; clearTimeout(E.ptimer); saveNow(p); }
  if (!E.dirty) return;
  clearTimeout(E.timer); E.dirty = false;
  const inner = $("#paper .cv"); if (!inner) return;
  const clone = inner.cloneNode(true); clone.removeAttribute("contenteditable");
  E.rec.html = sanitize(clone.outerHTML);
  if (E.rec.html.length > 900000) return toast("😮 That's a huge CV. Not saved — trim some text.");
  saveNow({ html: E.rec.html });
  const ph = (inner.textContent.match(/\[[^\]\n]{1,40}\]/g) || []).length;
  $("#phNote") && ($("#phNote").innerHTML = ph ? `🟨 ${ph} <b>[placeholder${ph > 1 ? "s" : ""}]</b> left to fill.` : "");
}
window.addEventListener("beforeunload", flushEditor);
document.addEventListener("visibilitychange", () => document.visibilityState === "hidden" && flushEditor());

async function setPhoto(dataUrl) {
  const E = S.editor; if (!E) return;

function squarePhoto(f) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const W = 300, H = 354, c = document.createElement("canvas"); c.width = W; c.height = H; const r = Math.max(W / img.width, H / img.height), w = img.width * r, h = img.height * r; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.drawImage(img, (W - w) / 2, (H - h) / 2.6, w, h); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .82)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

    $$("[data-sel]").forEach(b => b.onchange = () => { b.checked ? S.adminSel.add(b.dataset.sel) : S.adminSel.delete(b.dataset.sel); drawBulk(list); });
    $$("[data-ok]").forEach(b => b.onclick = () => approve([b.dataset.ok]));
    $$("[data-no]").forEach(b => b.onclick = () => reject([b.dataset.no]));
    $$("[data-revoke]").forEach(b => b.onclick = async () => {
      const r = S.adminReqs[b.dataset.revoke];
      if (!(await confirmBox("Revoke PRO?", `<p>${esc(r.email)} goes back to FREE and the request is marked rejected.</p>`, "Revoke"))) return;
      try { await update(R(), { [`users/${b.dataset.revoke}/plan`]: "free", [`requests/${b.dataset.revoke}/status`]: "rejected", [`requests/${b.dataset.revoke}/note`]: "PRO revoked by admin", [`requests/${b.dataset.revoke}/reviewedAt`]: serverTimestamp() }); toast("Revoked", true); } catch (e) { toast(dbErr(e)); }
    });
    drawBulk(list);
  }
  function drawBulk(list) {
    const el = $("#bulk");
    if (tab !== "pending" || !list.length) { el.innerHTML = ""; return; }
    const n = S.adminSel.size, all = n === list.length;
    el.innerHTML = `<div class="card row wrapf between" style="padding:10px 12px;background:var(--ink);color:#fff">
      <button class="btn sm" id="selAll">${all ? "Clear" : "Select all"} (${list.length})</button>
      <div class="row"><button class="btn sm pink" id="bRej" ${n ? "" : "disabled"}>❌ ${n}</button><button class="btn sm lime" id="bOk" ${n ? "" : "disabled"}>✅ Approve ${n}</button></div></div>`;
    $("#selAll").onclick = () => { if (all) S.adminSel.clear(); else list.forEach(r => S.adminSel.add(r.uid)); drawList(); };
    $("#bOk").onclick = () => approve([...S.adminSel]);
    $("#bRej").onclick = () => reject([...S.adminSel]);
  }
  drawList();
}

async function approve(uids) {
  uids = uids.filter(u => S.adminReqs[u]);
  if (!uids.length) return;
  if (!(await confirmBox(`Approve ${uids.length}?`, `<p>Did you see ${uids.length > 1 ? "these TrxIDs" : "this TrxID"} in your bKash with ৳${PRICE}?</p><p class="small num">${uids.map(u => esc(S.adminReqs[u].trxId)).join(", ")}</p>`, "Yes, approve", "lime", "✅"))) return;
  const u = {};
  uids.forEach(uid => { u[`users/${uid}/plan`] = "pro"; u[`users/${uid}/proAt`] = serverTimestamp(); u[`requests/${uid}/status`] = "approved"; u[`requests/${uid}/reviewedAt`] = serverTimestamp(); u[`requests/${uid}/note`] = null; });
  try { await update(R(), u); S.adminSel.clear(); confetti(); toast(`✅ ${uids.length} upgraded`, true); } catch (e) { toast(dbErr(e)); }
}
async function reject(uids) {
  uids = uids.filter(u => S.adminReqs[u]);
  if (!uids.length) return;
  const reasons = ["TrxID not found in bKash", `Amount less than ৳${PRICE}`, "TrxID already used", "Sender number doesn't match"];
  modal({ em: "❌", title: `Reject ${uids.length}?`, html: `<p class="small">The user sees this reason:</p><div class="row wrapf mt" style="gap:6px">${reasons.map(r => `<button class="chip rr">${esc(r)}</button>`).join("")}</div><input id="rNote" class="mt" maxlength="200" value="${esc(reasons[0])}">`,
    actions: [{ label: "Cancel", cls: "ghost" }, { label: "Reject", cls: "pink", onClick: async (b, bg) => {
      const note = $("#rNote", bg).value.trim().slice(0, 200) || reasons[0], u = {};
      uids.forEach(uid => { const r = S.adminReqs[uid]; u[`requests/${uid}/status`] = "rejected"; u[`requests/${uid}/note`] = note; u[`requests/${uid}/reviewedAt`] = serverTimestamp(); if (r.trxId && r.status === "pending") u[`trx/${r.trxId}`] = null; });
      try { await update(R(), u); S.adminSel.clear(); toast(`❌ ${uids.length} rejected`, true); } catch (e) { toast(dbErr(e)); return false; }
    } }] });
  setTimeout(() => $$(".rr").forEach(c => c.onclick = () => { $("#rNote").value = c.textContent; }), 0);
}
</script>
</body>
</html>
